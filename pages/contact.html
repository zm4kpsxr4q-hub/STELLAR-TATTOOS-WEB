<main>

   <section class="enquiry-form-section">
    <section class="store-map">
        <h2>Our Store</h2>
        <p>View our location on Google Maps below.</p>
        <div class="map-wrapper">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3311.8489000985874!2d18.509545675520517!3d-33.893545123217265!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc5c0fb57b95c5%3A0xbbb3bec045181737!2s490%20Century%20Blvd%2C%20Century%20City%2C%20Cape%20Town%2C%207446!5e0!3m2!1sen!2sza!4v1786689066987!5m2!1sen!2sza"
                width="100%" height="350" style="border:0;" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </section>
        <h2>Send Us a Message</h2>
        <form action="#" method="post" class="enquiry-form" id="contactForm" novalidate>
            <fieldset>
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Tell us who you are" autocomplete="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Where we can reply to you" autocomplete="email" required>

                <label for="proj_type">Project Type</label>
                <select id="proj_type" name="proj_type" required>
                    <option value="">Select a project type</option>
                    <option value="tattoo">Tattoo</option>
                    <option value="piercing">Piercing</option>
                    <option value="other">Other</option>
                </select>

                <label for="budget">Budget (R)</label>
                <input type="number" id="budget" name="budget" min="0" placeholder="What is your budget?" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Tell us more about your project" required></textarea>

                <div class="checkbox-row">
                    <label class="checkbox-option">
                        <input type="checkbox" id="consent" name="consent">
                        I agree that Stellar Tattoos may use my details to reply to this message.
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-solid">Submit</button>

            <div class="form-message" id="formMessage" role="status" aria-live="polite" hidden></div>
        </form>
    </section>
</main>
